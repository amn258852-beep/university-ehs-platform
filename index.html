<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>University EHS Platform</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f3f6f8;color:#17324d}
header{background:#123b5d;color:#fff;padding:20px 30px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:22px}
header p{margin:5px 0 0;color:#c9e6eb;font-size:13px}
.profile{background:#1c587d;padding:9px 14px;border-radius:20px;font-size:13px}
.layout{display:flex;min-height:calc(100vh - 80px)}
aside{width:230px;background:#fff;padding:24px 15px;border-right:1px solid #dce5e9}
aside h3{font-size:12px;color:#78909c;margin:0 12px 12px;text-transform:uppercase}
nav a{display:block;text-decoration:none;color:#35556b;padding:12px;border-radius:7px;margin-bottom:5px;font-size:14px}
nav a:hover,nav a.active{background:#e2f2f3;color:#087f8c;font-weight:bold}
main{flex:1;padding:30px;max-width:1500px}
.welcome{margin-bottom:24px}
.welcome h2{font-size:28px;margin:0 0 8px}
.welcome p{color:#607d8b}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}
.card,.panel{background:#fff;border-radius:12px;padding:21px;box-shadow:0 3px 12px #193c5012}
.card{border-left:5px solid #18a2a8}
.card.blue{border-color:#2474b5}
.card.warning{border-color:#f59e0b}
.card.danger{border-color:#dc3545}
.card-label{color:#78909c;font-size:13px;margin-bottom:10px}
.card-number{font-size:30px;font-weight:bold}
.card-note{font-size:12px;color:#607d8b;margin-top:7px}
.content-grid{display:grid;grid-template-columns:2fr 1fr;gap:22px}
.panel h3{margin:0 0 18px}
.map{height:260px;border-radius:10px;background:#d9e8e5;position:relative;overflow:hidden}
.building{position:absolute;background:#fff;border:2px solid #54818b;border-radius:5px;padding:14px;font-size:12px;color:#23485c;box-shadow:0 2px 7px #0002;cursor:pointer;transition:.2s}
.building:hover{transform:scale(1.04);box-shadow:0 5px 15px #0004}
.building.one{left:12%;top:20%;width:150px}
.building.two{right:13%;top:18%;width:165px}
.building.three{left:30%;bottom:14%;width:180px}
.dot{width:10px;height:10px;display:inline-block;border-radius:50%;margin-right:5px}
.green{background:#22a06b}
.orange{background:#f59e0b}
.red{background:#dc3545}
.map-legend{margin-top:14px;display:flex;gap:16px;font-size:12px;color:#607d8b}.lab-filters {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 22px;
}

.lab-filters input,
.lab-filters select {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid #d5e0e5;
  border-radius: 7px;
  background: #fff;
  color: #35556b;
  font-size: 13px;
}

.lab-filters input:focus,
.lab-filters select:focus {
  outline: 2px solid #9edadd;
  border-color: #087f8c;
}

@media(max-width:900px) {
  .lab-filters {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media(max-width:600px) {
  .lab-filters {
    grid-template-columns: 1fr;
  }
}
.lab-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #edf1f2;cursor:pointer}
.lab-row:hover{background:#eef8f8;padding-left:10px;padding-right:10px;border-radius:8px}
.lab-name{font-weight:bold;font-size:14px}
.lab-location{color:#78909c;font-size:12px;margin-top:5px}
.occupancy{text-align:right;font-size:13px}
.status{display:inline-block;margin-top:5px;padding:4px 8px;border-radius:12px;font-size:11px}
.normal{background:#e4f6ed;color:#177245}
.attention{background:#fff1d6;color:#9a5b00}
.panel button{background:#087f8c;color:#fff;border:0;border-radius:6px;padding:10px 14px;margin:5px;cursor:pointer}
.panel button:hover{background:#065f68}
.modal-overlay{display:none;position:fixed;inset:0;background:#0c2a3daa;justify-content:center;align-items:center;z-index:10;padding:20px}
.modal{background:#fff;width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:28px;position:relative}
.modal-close{position:absolute;right:16px;top:10px;border:0;background:transparent;font-size:25px;color:#607d8b;cursor:pointer}
.modal h2{color:#123b5d;margin:0 0 8px}
.modal-subtitle{color:#78909c;margin-bottom:18px}
.detail-section{margin-top:16px}
.detail-section h4{color:#087f8c;margin:0 0 6px}
.detail-section p{color:#455a64;line-height:1.6;margin:0}

@media(max-width:900px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .content-grid{grid-template-columns:1fr}
}

@media(max-width:600px){
  header{padding:18px}
  .profile{display:none}
  .layout{display:block}
  aside{width:100%;padding:12px}
  nav{display:flex;overflow-x:auto}
  nav a{white-space:nowrap;margin-right:5px}
  main{padding:18px}
  .cards{grid-template-columns:1fr}
}
  .panel label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  color: #35556b;
  font-size: 13px;
  font-weight: bold;
}

.panel input,
.panel select,
.panel textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid #d5e0e5;
  border-radius: 7px;
  font-size: 13px;
  color: #35556b;
  background: white;
}

.panel textarea {
  min-height: 75px;
  resize: vertical;
}

.admin-buttons {
  margin-top: 22px;
}

.secondary-button {
  background: #607d8b !important;
}

#adminMessage {
  color: #177245;
  margin-top: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <div>
    <h1>University EHS Platform</h1>
    <p>Safety Intelligence and Emergency Readiness</p>
  </div>
  <div class="profile">Prototype Dashboard</div>
</header>

<div class="layout">

<aside>
  <h3>Navigation</h3>

  <nav>
    <a href="#" class="active" data-section="Dashboard">Dashboard</a>
    <a href="#" data-section="Digital Twin Map">Digital Twin Map</a>
    <a href="#" data-section="Laboratories">Laboratories</a>
    <a href="#" data-section="Documents">Documents</a>
    <a href="#" data-section="Contacts">Contacts</a>
    <a href="#" data-section="EHS Assistant">EHS Assistant</a>
    <a href="#" data-section="Administration">Administration</a>
  </nav>
</aside>

<main id="main"></main>

</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" id="closeModal">×</button>

    <h2 id="mName"></h2>
    <div class="modal-subtitle" id="mLocation"></div>

    <div class="detail-section">
      <h4>Occupancy</h4>
      <p id="mOccupancy"></p>
    </div>

    <div class="detail-section">
      <h4>Main Hazards</h4>
      <p id="mHazards"></p>
    </div>

    <div class="detail-section">
      <h4>Required PPE</h4>
      <p id="mPpe"></p>
    </div>

    <div class="detail-section">
      <h4>Emergency Equipment</h4>
      <p id="mEquipment"></p>
    </div>

    <div class="detail-section">
      <h4>Responsible Contact</h4>
      <p id="mContact"></p>
    </div>
  </div>
</div>

<script>
let labs = {
  "Chemistry Lab 204": {
    department: "Chemistry Department",
    location: "Science Building",
    occupancy: "8 / 30 people",
    status: "Normal",
    hazards: "Chemical substances, compressed gases, hot equipment",
    ppe: "Safety glasses, laboratory coat, closed shoes, suitable gloves",
    equipment: "Emergency shower, eyewash station, fire extinguisher",
    contact: "Chemical Safety Specialist"
  },

  "Biology Lab 105": {
    department: "Biology Department",
    location: "Science Building",
    occupancy: "21 / 20 people",
    status: "Over capacity",
    hazards: "Biological materials, sharps, laboratory chemicals",
    ppe: "Laboratory coat, gloves, safety glasses",
    equipment: "Eyewash station, biological spill kit, fire extinguisher",
    contact: "Biosafety Specialist"
  },

  "Materials Lab 310": {
    department: "Materials Engineering Department",
    location: "Engineering Building",
    occupancy: "6 / 25 people",
    status: "Normal",
    hazards: "Machinery, noise, dust, heated materials",
    ppe: "Safety glasses, safety shoes, hearing protection",
    equipment: "First-aid kit, fire extinguisher, emergency stop system",
    contact: "Laboratory Safety Specialist"
  }
};

let buildings = {
  "Science Building": {
    location: "Main Science Campus",
    occupancy: "Estimated occupancy: 42 people",
    status: "Normal",
    hazards: "Chemical laboratories, biological materials, compressed gases",
    ppe: "Laboratory coat, safety glasses, closed shoes",
    equipment: "Fire extinguishers, eyewash stations, emergency showers",
    contact: "EHS Laboratory Safety Specialist",
    departments: [
      "Chemistry Department",
      "Biology Department"
    ]
  },

  "Engineering Building": {
    location: "Engineering Campus",
    occupancy: "Estimated occupancy: 27 people",
    status: "Attention required",
    hazards: "Machinery, noise, dust, hot work, workshops",
    ppe: "Safety glasses, safety shoes, hearing protection",
    equipment: "First-aid kits, emergency stops, fire extinguishers",
    contact: "EHS Occupational Safety Specialist",
    departments: [
      "Materials Engineering Department"
    ]
  },

  "Research Complex": {
    location: "Research Campus",
    occupancy: "Estimated occupancy: 57 people",
    status: "Normal",
    hazards: "Research chemicals, specialized equipment, biological materials",
    ppe: "Activity-specific PPE",
    equipment: "Spill kits, emergency showers, eyewash stations",
    contact: "EHS Research Safety Specialist",
    departments: [
      "Research and Innovation Department"
    ]
  }
};

const main = document.getElementById("main");
const savedLaboratories =
  localStorage.getItem("ehsLaboratories");

if (savedLaboratories) {
  labs = JSON.parse(savedLaboratories);
}
function dashboard() {
  main.innerHTML = `
    <section class="welcome">
      <h2>EHS Overview</h2>
      <p>Monitor campus safety information, laboratory occupancy, and emergency readiness.</p>
    </section>

    <section class="cards">
      <div class="card">
        <div class="card-label">Registered Laboratories</div>
        <div class="card-number">48</div>
        <div class="card-note">Across the university campus</div>
      </div>

      <div class="card blue">
        <div class="card-label">Estimated Occupants</div>
        <div class="card-number">126</div>
        <div class="card-note">Sample data</div>
      </div>

      <div class="card warning">
        <div class="card-label">Laboratories Requiring Attention</div>
        <div class="card-number">4</div>
        <div class="card-note">Review recommended</div>
      </div>

      <div class="card danger">
        <div class="card-label">Safety Alerts</div>
        <div class="card-number">2</div>
        <div class="card-note">Requires EHS review</div>
      </div>
    </section>

    <section class="content-grid">
      <div class="panel">
        <h3>University EHS Digital Twin</h3>
        ${mapHtml()}
      </div>

      <div class="panel">
        <h3>Laboratory Occupancy</h3>
        ${labRows()}
      </div>
    </section>
  `;

  bindInteractions();
}

function mapHtml() {
  return `
    <div class="map" onclick="mapPage()">
      <div class="building one" data-building="Science Building">
        Science Building<br>
        <span class="dot green"></span>12 laboratories
      </div>

      <div class="building two" data-building="Engineering Building">
        Engineering Building<br>
        <span class="dot orange"></span>8 laboratories
      </div>

      <div class="building three" data-building="Research Complex">
        Research Complex<br>
        <span class="dot green"></span>18 laboratories
      </div>
    </div>

    <div class="map-legend">
      <span><span class="dot green"></span>Normal</span>
      <span><span class="dot orange"></span>Attention</span>
      <span><span class="dot red"></span>High risk</span>
    </div>
  `;
}

function labRows() {
  return Object.entries(labs).map(([name, lab]) => `
    <div class="lab-row" data-lab="${name}">
      <div>
        <div class="lab-name">${name}</div>
        <div class="lab-location">
          ${lab.department} • ${lab.location}
        </div>
      </div>

      <div class="occupancy">
        ${lab.occupancy}
        <div class="status ${lab.status === "Normal" ? "normal" : "attention"}">
          ${lab.status}
        </div>
      </div>
    </div>
  `).join("");
}

function laboratories() {
  main.innerHTML = `
    <section class="welcome">
      <h2>Laboratories</h2>
      <p>Search, filter, and sort university laboratories.</p>
    </section>

    <section class="panel">
      <div class="lab-filters">
        <input
          type="text"
          id="labSearch"
          placeholder="Search laboratory..."
        >

        <select id="buildingFilter">
          <option value="">All Buildings</option>
          <option value="Science Building">Science Building</option>
          <option value="Engineering Building">Engineering Building</option>
          <option value="Research Complex">Research Complex</option>
        </select>

        <select id="departmentFilter">
          <option value="">All Departments</option>
          <option value="Chemistry Department">Chemistry Department</option>
          <option value="Biology Department">Biology Department</option>
          <option value="Materials Engineering Department">
            Materials Engineering Department
          </option>
          <option value="Research and Innovation Department">
            Research and Innovation Department
          </option>
        </select>

        <select id="statusFilter">
          <option value="">All Statuses</option>
          <option value="Normal">Normal</option>
          <option value="Over capacity">Over capacity</option>
        </select>

        <select id="sortLabs">
          <option value="name">Sort: Laboratory Name</option>
          <option value="occupancy">Sort: Occupancy</option>
          <option value="building">Sort: Building</option>
          <option value="department">Sort: Department</option>
        </select>
      </div>

      <div id="laboratoryResults"></div>
    </section>
  `;

  renderLaboratoryResults();

  document.getElementById("labSearch").oninput =
    renderLaboratoryResults;

  document.getElementById("buildingFilter").onchange =
    renderLaboratoryResults;

  document.getElementById("departmentFilter").onchange =
    renderLaboratoryResults;

  document.getElementById("statusFilter").onchange =
    renderLaboratoryResults;

  document.getElementById("sortLabs").onchange =
    renderLaboratoryResults;
}

function renderLaboratoryResults() {
  const searchValue =
    document.getElementById("labSearch").value.toLowerCase();

  const buildingValue =
    document.getElementById("buildingFilter").value;

  const departmentValue =
    document.getElementById("departmentFilter").value;

  const statusValue =
    document.getElementById("statusFilter").value;

  const sortValue =
    document.getElementById("sortLabs").value;

  let results = Object.entries(labs).filter(([name, lab]) => {
    const matchesSearch =
      name.toLowerCase().includes(searchValue) ||
      lab.location.toLowerCase().includes(searchValue) ||
      lab.department.toLowerCase().includes(searchValue);

    const matchesBuilding =
      !buildingValue || lab.location === buildingValue;

    const matchesDepartment =
      !departmentValue || lab.department === departmentValue;

    const matchesStatus =
      !statusValue || lab.status === statusValue;

    return (
      matchesSearch &&
      matchesBuilding &&
      matchesDepartment &&
      matchesStatus
    );
  });

  results.sort(([nameA, labA], [nameB, labB]) => {
    if (sortValue === "occupancy") {
      const occupancyA = parseInt(labA.occupancy);
      const occupancyB = parseInt(labB.occupancy);
      return occupancyB - occupancyA;
    }

    if (sortValue === "building") {
      return labA.location.localeCompare(labB.location);
    }

    if (sortValue === "department") {
      return labA.department.localeCompare(labB.department);
    }

    return nameA.localeCompare(nameB);
  });

  const resultsContainer =
    document.getElementById("laboratoryResults");

  if (results.length === 0) {
    resultsContainer.innerHTML = `
      <p style="color:#607d8b;margin-top:20px">
        No laboratories match the selected filters.
      </p>
    `;
    return;
  }

  resultsContainer.innerHTML = results.map(([name, lab]) => `
    <div class="lab-row" data-lab="${name}">
      <div>
        <div class="lab-name">${name}</div>
        <div class="lab-location">
          ${lab.department} • ${lab.location}
        </div>
      </div>

      <div class="occupancy">
        ${lab.occupancy}
        <div class="status ${
          lab.status === "Normal" ? "normal" : "attention"
        }">
          ${lab.status}
        </div>
      </div>
    </div>
  `).join("");

  bindInteractions();
}
  function simplePage(title, text, body) {
  main.innerHTML = `
    <section class="welcome">
      <h2>${title}</h2>
      <p>${text}</p>
    </section>

    <section class="panel">
      ${body}
    </section>
  `;
}
function mapPage() {
  main.innerHTML = `
    <section class="welcome">
      <h2>University EHS Digital Twin</h2>
      <p>Explore buildings, laboratories, hazards, and emergency information.</p>
    </section>

    <section class="panel">
      <h3>Campus Safety Map</h3>
      ${mapHtml()}
    </section>
  `;

  bindInteractions();
}

function administration() {
  const laboratoryOptions = Object.keys(labs)
    .map(name => `
      <option value="${name}">
        ${name}
      </option>
    `)
    .join("");

  main.innerHTML = `
    <section class="welcome">
      <h2>Administration</h2>
      <p>Edit laboratory information without changing the code.</p>
    </section>

    <section class="panel">
      <h3>Edit Laboratory</h3>

      <label>Laboratory</label>
      <select id="editLabSelect">
        ${laboratoryOptions}
      </select>

      <label>Laboratory Name</label>
      <input id="editLabName" type="text">

      <label>Department</label>
      <input id="editLabDepartment" type="text">

      <label>Building</label>
      <input id="editLabBuilding" type="text">

      <label>Occupancy</label>
      <input id="editLabOccupancy" type="text">

      <label>Status</label>
      <select id="editLabStatus">
        <option value="Normal">Normal</option>
        <option value="Over capacity">Over capacity</option>
        <option value="Under review">Under review</option>
        <option value="Closed">Closed</option>
      </select>

      <label>Main Hazards</label>
      <textarea id="editLabHazards"></textarea>

      <label>Required PPE</label>
      <textarea id="editLabPpe"></textarea>

      <label>Emergency Equipment</label>
      <textarea id="editLabEquipment"></textarea>

      <label>Responsible Contact</label>
      <input id="editLabContact" type="text">

      <div class="admin-buttons">
        <button id="saveLabButton">Save Changes</button>
        <button id="resetLabButton" class="secondary-button">
          Reset Saved Data
        </button>
      </div>

      <p id="adminMessage"></p>
    </section>
  `;

  loadLaboratoryIntoForm();

  document.getElementById("editLabSelect").onchange =
    loadLaboratoryIntoForm;

  document.getElementById("saveLabButton").onclick =
    saveLaboratoryFromForm;

  document.getElementById("resetLabButton").onclick =
    resetSavedLaboratoryData;
}
function loadLaboratoryIntoForm() {
  const selectedName =
    document.getElementById("editLabSelect").value;

  const lab = labs[selectedName];

  if (!lab) {
    return;
  }

  document.getElementById("editLabName").value = selectedName;
  document.getElementById("editLabDepartment").value =
    lab.department || "";
  document.getElementById("editLabBuilding").value =
    lab.location || "";
  document.getElementById("editLabOccupancy").value =
    lab.occupancy || "";
  document.getElementById("editLabStatus").value =
    lab.status || "Normal";
  document.getElementById("editLabHazards").value =
    lab.hazards || "";
  document.getElementById("editLabPpe").value =
    lab.ppe || "";
  document.getElementById("editLabEquipment").value =
    lab.equipment || "";
  document.getElementById("editLabContact").value =
    lab.contact || "";
}

function saveLaboratoryFromForm() {
  const oldName =
    document.getElementById("editLabSelect").value;

  const newName =
    document.getElementById("editLabName").value.trim();

  if (!newName) {
    alert("Please enter a laboratory name.");
    return;
  }

  const updatedLaboratory = {
    department:
      document.getElementById("editLabDepartment").value.trim(),

    location:
      document.getElementById("editLabBuilding").value.trim(),

    occupancy:
      document.getElementById("editLabOccupancy").value.trim(),

    status:
      document.getElementById("editLabStatus").value,

    hazards:
      document.getElementById("editLabHazards").value.trim(),

    ppe:
      document.getElementById("editLabPpe").value.trim(),

    equipment:
      document.getElementById("editLabEquipment").value.trim(),

    contact:
      document.getElementById("editLabContact").value.trim()
  };

  if (newName !== oldName) {
    delete labs[oldName];
  }

  labs[newName] = updatedLaboratory;

  localStorage.setItem(
    "ehsLaboratories",
    JSON.stringify(labs)
  );

  document.getElementById("adminMessage").textContent =
    "Laboratory information saved successfully.";

  refreshLaboratorySelector(newName);
}

function refreshLaboratorySelector(selectedName) {
  const selector =
    document.getElementById("editLabSelect");

  selector.innerHTML = Object.keys(labs)
    .map(name => `
      <option value="${name}">
        ${name}
      </option>
    `)
    .join("");

  selector.value = selectedName;
}

function resetSavedLaboratoryData() {
  const confirmation = confirm(
    "Reset all saved laboratory changes?"
  );

  if (!confirmation) {
    return;
  }

  localStorage.removeItem("ehsLaboratories");

  alert(
    "Saved laboratory changes have been removed. Refresh the page to restore the original sample data."
  );

  location.reload();
}
function openProfile(name, data) {
  document.getElementById("mName").textContent = name;

  document.getElementById("mLocation").textContent =
    (data.department ? data.department + " • " : "") +
    data.location;

  document.getElementById("mOccupancy").textContent =
    data.occupancy + " — " + data.status;

  document.getElementById("mHazards").textContent = data.hazards;
  document.getElementById("mPpe").textContent = data.ppe;
  document.getElementById("mEquipment").textContent = data.equipment;
  document.getElementById("mContact").textContent = data.contact;

  document.getElementById("modal").style.display = "flex";
}

function buildingProfile(name) {
  const building = buildings[name];

  const departments = building.departments.map(department => `
    <div class="lab-row" data-department="${department}">
      <div>
        <div class="lab-name">${department}</div>
        <div class="lab-location">Click to view laboratories</div>
      </div>

      <div>›</div>
    </div>
  `).join("");

  main.innerHTML = `
    <section class="welcome">
      <button class="panel button" onclick="mapPage()">
        ← Back to Map
      </button>

      <h2 style="margin-top:20px">${name}</h2>
      <p>${building.location} • ${building.status}</p>
    </section>

    <section class="panel">
      <h3>Building Safety Profile</h3>

      <p style="line-height:1.8;color:#607d8b">
        ${building.occupancy}<br>
        Hazards: ${building.hazards}<br>
        Emergency equipment: ${building.equipment}<br>
        Contact: ${building.contact}
      </p>

      <h3 style="margin-top:24px">
        Departments in this Building
      </h3>

      ${departments}
    </section>
  `;

  document.querySelectorAll("[data-department]").forEach(item => {
    item.onclick = () =>
      departmentProfile(item.dataset.department, name);
  });
}

function departmentProfile(name, buildingName) {
  const departmentLabs = Object.entries(labs)
    .filter(([, lab]) => lab.department === name);

  const rows = departmentLabs.length
    ? departmentLabs.map(([labName, lab]) => `
        <div class="lab-row" data-lab="${labName}">
          <div>
            <div class="lab-name">${labName}</div>
            <div class="lab-location">
              ${lab.location} • ${lab.status}
            </div>
          </div>

          <div class="occupancy">${lab.occupancy}</div>
        </div>
      `).join("")
    : `<p style="color:#607d8b">
         No laboratories have been added yet.
       </p>`;

  main.innerHTML = `
    <section class="welcome">
      <button class="panel button" onclick="buildingProfile('${buildingName}')">
        ← Back to ${buildingName}
      </button>

      <h2 style="margin-top:20px">${name}</h2>
      <p>Laboratories and safety information</p>
    </section>

    <section class="panel">
      <h3>Laboratories in this Department</h3>
      ${rows}
    </section>
  `;

  bindInteractions();
}

function bindInteractions() {
  document.querySelectorAll("[data-lab]").forEach(item => {
    item.onclick = () => {
      openProfile(item.dataset.lab, labs[item.dataset.lab]);
    };
  });

  document.querySelectorAll("[data-building]").forEach(item => {
    item.onclick = event => {
      event.stopPropagation();
      buildingProfile(item.dataset.building);
    };
  });
}
document.getElementById("closeModal").onclick = function() {
  document.getElementById("modal").style.display = "none";
};

document.getElementById("modal").onclick = function(event) {
  if (event.target.id === "modal") {
    document.getElementById("modal").style.display = "none";
  }
};
document.querySelectorAll("nav a").forEach(link => {
  link.onclick = event => {
    event.preventDefault();

    document.querySelectorAll("nav a").forEach(item => {
      item.classList.remove("active");
    });

    link.classList.add("active");

    const section = link.dataset.section;

    if (section === "Dashboard") {
      dashboard();
    } else if (section === "Laboratories") {
      laboratories();
    } else if (section === "Digital Twin Map") {
      mapPage();
    } else if (section === "Documents") {
      simplePage(
        "EHS Documents",
        "Access approved safety documents.",
        "<h3>Document Library</h3><p>Sample documents will be added here.</p>"
      );
    } else if (section === "Contacts") {
      simplePage(
        "EHS Contacts",
        "Find the appropriate safety contact.",
        "<h3>Contact Directory</h3><p>EHS Main Office<br>Chemical Safety Specialist<br>Emergency Response<br>Facilities and Maintenance</p>"
      );
    } else if (section === "EHS Assistant") {
      simplePage(
        "Controlled EHS Assistant",
        "Ask questions about approved EHS procedures.",
        "<h3>How can I help?</h3><button onclick=\"alert('Use the approved laboratory procedure and contact EHS for urgent matters.')\">What PPE is required?</button><button onclick=\"alert('Keep people away, follow the spill procedure, and contact EHS.')\">What should I do after a spill?</button>"
      );
   } else {
  administration();
}
  };
});

dashboard();
</script>
