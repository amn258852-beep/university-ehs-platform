<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>University EHS Platform</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#f3f6f8;color:#17324d}header{background:#123b5d;color:#fff;padding:20px 30px;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;color:#c9e6eb;font-size:13px}.profile{background:#1c587d;padding:9px 14px;border-radius:20px;font-size:13px}.layout{display:flex;min-height:calc(100vh - 80px)}aside{width:230px;background:#fff;padding:24px 15px;border-right:1px solid #dce5e9}aside h3{font-size:12px;color:#78909c;margin:0 12px 12px;text-transform:uppercase}nav a{display:block;text-decoration:none;color:#35556b;padding:12px;border-radius:7px;margin-bottom:5px;font-size:14px}nav a:hover,nav a.active{background:#e2f2f3;color:#087f8c;font-weight:bold}main{flex:1;padding:30px;max-width:1500px}.welcome{margin-bottom:24px}.welcome h2{font-size:28px;margin:0 0 8px}.welcome p{color:#607d8b}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}.card,.panel{background:#fff;border-radius:12px;padding:21px;box-shadow:0 3px 12px #193c5012}.card{border-left:5px solid #18a2a8}.card.blue{border-color:#2474b5}.card.warning{border-color:#f59e0b}.card.danger{border-color:#dc3545}.card-label{color:#78909c;font-size:13px;margin-bottom:10px}.card-number{font-size:30px;font-weight:bold}.card-note{font-size:12px;color:#607d8b;margin-top:7px}.content-grid{display:grid;grid-template-columns:2fr 1fr;gap:22px}.panel h3{margin:0 0 18px}.map{height:260px;border-radius:10px;background:#d9e8e5;position:relative;overflow:hidden}.building{position:absolute;background:#fff;border:2px solid #54818b;border-radius:5px;padding:14px;font-size:12px;color:#23485c;box-shadow:0 2px 7px #0002;cursor:pointer;transition:.2s}.building:hover{transform:scale(1.04);box-shadow:0 5px 15px #0004}.building.one{left:12%;top:20%;width:150px}.building.two{right:13%;top:18%;width:165px}.building.three{left:30%;bottom:14%;width:180px}.dot{width:10px;height:10px;display:inline-block;border-radius:50%;margin-right:5px}.green{background:#22a06b}.orange{background:#f59e0b}.red{background:#dc3545}.map-legend{margin-top:14px;display:flex;gap:16px;font-size:12px;color:#607d8b}.lab-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #edf1f2;cursor:pointer}.lab-row:hover{background:#eef8f8;padding-left:10px;padding-right:10px;border-radius:8px}.lab-name{font-weight:bold;font-size:14px}.lab-location{color:#78909c;font-size:12px;margin-top:5px}.occupancy{text-align:right;font-size:13px}.status{display:inline-block;margin-top:5px;padding:4px 8px;border-radius:12px;font-size:11px}.normal{background:#e4f6ed;color:#177245}.attention{background:#fff1d6;color:#9a5b00}.panel button{background:#087f8c;color:#fff;border:0;border-radius:6px;padding:10px 14px;margin:5px;cursor:pointer}.panel button:hover{background:#065f68}.modal-overlay{display:none;position:fixed;inset:0;background:#0c2a3daa;justify-content:center;align-items:center;z-index:10;padding:20px}.modal{background:#fff;width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:28px;position:relative}.modal-close{position:absolute;right:16px;top:10px;border:0;background:transparent;font-size:25px;color:#607d8b;cursor:pointer}.modal h2{color:#123b5d;margin:0 0 8px}.modal-subtitle{color:#78909c;margin-bottom:18px}.detail-section{margin-top:16px}.detail-section h4{color:#087f8c;margin:0 0 6px}.detail-section p{color:#455a64;line-height:1.6;margin:0}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.content-grid{grid-template-columns:1fr}}@media(max-width:600px){header{padding:18px}.profile{display:none}.layout{display:block}aside{width:100%;padding:12px}nav{display:flex;overflow-x:auto}nav a{white-space:nowrap;margin-right:5px}main{padding:18px}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><h1>University EHS Platform</h1><p>Safety Intelligence and Emergency Readiness</p></div><div class="profile">Prototype Dashboard</div></header>
<div class="layout"><aside><h3>Navigation</h3><nav>
<a href="#" class="active" data-section="Dashboard">Dashboard</a><a href="#" data-section="Digital Twin Map">Digital Twin Map</a><a href="#" data-section="Laboratories">Laboratories</a><a href="#" data-section="Documents">Documents</a><a href="#" data-section="Contacts">Contacts</a><a href="#" data-section="EHS Assistant">EHS Assistant</a><a href="#" data-section="Administration">Administration</a>
</nav></aside><main id="main"></main></div>
<div class="modal-overlay" id="modal"><div class="modal"><button class="modal-close" id="closeModal">×</button><h2 id="mName"></h2><div class="modal-subtitle" id="mLocation"></div><div class="detail-section"><h4>Occupancy</h4><p id="mOccupancy"></p></div><div class="detail-section"><h4>Main Hazards</h4><p id="mHazards"></p></div><div class="detail-section"><h4>Required PPE</h4><p id="mPpe"></p></div><div class="detail-section"><h4>Emergency Equipment</h4><p id="mEquipment"></p></div><div class="detail-section"><h4>Responsible Contact</h4><p id="mContact"></p></div></div></div>
<script>
const labs={"Chemistry Lab 204":{location:"Science Building",occupancy:"8 / 30 people",status:"Normal",hazards:"Chemical substances, compressed gases, hot equipment",ppe:"Safety glasses, laboratory coat, closed shoes, suitable gloves",equipment:"Emergency shower, eyewash station, fire extinguisher",contact:"Chemical Safety Specialist"},"Biology Lab 105":{location:"Science Building",occupancy:"21 / 20 people",status:"Over capacity",hazards:"Biological materials, sharps, laboratory chemicals",ppe:"Laboratory coat, gloves, safety glasses",equipment:"Eyewash station, biological spill kit, fire extinguisher",contact:"Biosafety Specialist"},"Materials Lab 310":{location:"Engineering Building",occupancy:"6 / 25 people",status:"Normal",hazards:"Machinery, noise, dust, heated materials",ppe:"Safety glasses, safety shoes, hearing protection",equipment:"First-aid kit, fire extinguisher, emergency stop system",contact:"Laboratory Safety Specialist"}};
const buildings={"Science Building":{location:"Main Science Campus",occupancy:"Estimated occupancy: 42 people",status:"Normal",hazards:"Chemical laboratories, biological materials, compressed gases",ppe:"Laboratory coat, safety glasses, closed shoes",equipment:"Fire extinguishers, eyewash stations, emergency showers",contact:"EHS Laboratory Safety Specialist"},"Engineering Building":{location:"Engineering Campus",occupancy:"Estimated occupancy: 27 people",status:"Attention required",hazards:"Machinery, noise, dust, hot work, workshops",ppe:"Safety glasses, safety shoes, hearing protection",equipment:"First-aid kits, emergency stops, fire extinguishers",contact:"EHS Occupational Safety Specialist"},"Research Complex":{location:"Research Campus",occupancy:"Estimated occupancy: 57 people",status:"Normal",hazards:"Research chemicals, specialized equipment, biological materials",ppe:"Activity-specific PPE",equipment:"Spill kits, emergency showers, eyewash stations",contact:"EHS Research Safety Specialist"}};
const main=document.getElementById('main');
function dashboard(){main.innerHTML=`<section class="welcome"><h2>EHS Overview</h2><p>Monitor campus safety information, laboratory occupancy, and emergency readiness.</p></section><section class="cards"><div class="card"><div class="card-label">Registered Laboratories</div><div class="card-number">48</div><div class="card-note">Across the university campus</div></div><div class="card blue"><div class="card-label">Estimated Occupants</div><div class="card-number">126</div><div class="card-note">Sample data</div></div><div class="card warning"><div class="card-label">Laboratories Requiring Attention</div><div class="card-number">4</div><div class="card-note">Review recommended</div></div><div class="card danger"><div class="card-label">Safety Alerts</div><div class="card-number">2</div><div class="card-note">Requires EHS review</div></div></section><section class="content-grid"><div class="panel"><h3>University EHS Digital Twin</h3>${mapHtml()}</div><div class="panel"><h3>Laboratory Occupancy</h3>${labRows()}</div></section>`;bindInteractions()}
function mapHtml(){return `<div class="map"><div class="building one" data-building="Science Building">Science Building<br><span class="dot green"></span>12 laboratories</div><div class="building two" data-building="Engineering Building">Engineering Building<br><span class="dot orange"></span>8 laboratories</div><div class="building three" data-building="Research Complex">Research Complex<br><span class="dot green"></span>18 laboratories</div></div><div class="map-legend"><span><span class="dot green"></span>Normal</span><span><span class="dot orange"></span>Attention</span><span><span class="dot red"></span>High risk</span></div>`}
function labRows(){return Object.entries(labs).map(([n,l])=>`<div class="lab-row" data-lab="${n}"><div><div class="lab-name">${n}</div><div class="lab-location">${l.location}</div></div><div class="occupancy">${l.occupancy}<div class="status ${l.status==='Normal'?'normal':'attention'}">${l.status}</div></div></div>`).join('')}
function laboratories(){main.innerHTML=`<section class="welcome"><h2>Laboratories</h2><p>View laboratory occupancy and safety information.</p></section><section class="panel"><h3>Registered Laboratories</h3>${labRows()}</section>`;bindInteractions()}
function mapPage(){main.innerHTML=`<section class="welcome"><h2>University EHS Digital Twin</h2><p>Explore buildings, laboratories, hazards, and emergency information.</p></section><section class="panel"><h3>Campus Safety Map</h3>${mapHtml()}</section>`;bindInteractions()}
function simplePage(title,text,body){main.innerHTML=`<section class="welcome"><h2>${title}</h2><p>${text}</p></section><section class="panel">${body}</section>`}
function openProfile(name,data){document.getElementById('mName').textContent=name;document.getElementById('mLocation').textContent=data.location;document.getElementById('mOccupancy').textContent=data.occupancy+' — '+data.status;document.getElementById('mHazards').textContent=data.hazards;document.getElementById('mPpe').textContent=data.ppe;document.getElementById('mEquipment').textContent=data.equipment;document.getElementById('mContact').textContent=data.contact;document.getElementById('modal').style.display='flex'}
function bindInteractions(){document.querySelectorAll('[data-lab]').forEach(x=>x.onclick=()=>openProfile(x.dataset.lab,labs[x.dataset.lab]));document.querySelectorAll('[data-building]').forEach(x=>x.onclick=()=>openProfile(x.dataset.building,buildings[x.dataset.building]))}
document.getElementById('closeModal').onclick=()=>document.getElementById('modal').style.display='none';document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.target.style.display='none'};
document.querySelectorAll('nav a').forEach(link=>link.onclick=e=>{e.preventDefault();document.querySelectorAll('nav a').forEach(x=>x.classList.remove('active'));link.classList.add('active');const s=link.dataset.section;if(s==='Dashboard')dashboard();else if(s==='Laboratories')laboratories();else if(s==='Digital Twin Map')mapPage();else if(s==='Documents')simplePage('EHS Documents','Access approved safety documents','<h3>Document Library</h3><p>Sample documents will be added here.</p>');else if(s==='Contacts')simplePage('EHS Contacts','Find the appropriate safety contact','<h3>Contact Directory</h3><p>EHS Main Office<br>Chemical Safety Specialist<br>Emergency Response<br>Facilities and Maintenance</p>');else if(s==='EHS Assistant')simplePage('Controlled EHS Assistant','Ask questions about approved EHS procedures','<h3>How can I help?</h3><button onclick="alert(\'Use the approved laboratory procedure and contact EHS for urgent matters.\')">What PPE is required?</button><button onclick="alert(\'Keep people away, follow the spill procedure, and contact EHS.\')">What should I do after a spill?</button>');else simplePage('Administration','Prototype administration functions','<h3>Management Functions</h3><p>Laboratory, occupancy, document, contact, and alert management will be added later.</p>')});
dashboard();
</script>
</body>
</html>
